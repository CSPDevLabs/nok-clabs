apiVersion: operator.gnmic.dev/v1alpha1
kind: Subscription
metadata:
  namespace: nok-dia
  name: sros-port-drops
  labels:
    type: portDrops
spec:
  paths:
    - /state/port[port-id=*]/statistics/in-discards 
    - /state/port[port-id=*]/statistics/out-discards 
  mode: STREAM/SAMPLE
  encoding: JSON
  sampleInterval: 60s