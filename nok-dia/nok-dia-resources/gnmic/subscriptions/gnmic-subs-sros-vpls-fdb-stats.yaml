apiVersion: operator.gnmic.dev/v1alpha1
kind: Subscription
metadata:
  namespace: nok-dia
  name: sros-vpls-fdb-stats
  labels:
    type: vpls-fdb
spec:
  paths:
    - /state/service/statistics/vpls-fdb/entries-allocated
    - /state/service/statistics/vpls-fdb/entries-in-use
    - /state/service/statistics/vpls-fdb/entries-total
    - /state/service/statistics/vpls-fdb/hw-limit-exceeded
    - /state/service/statistics/vpls-fdb/table-full
    - /state/service/statistics/vpls-fdb/limit-exceeded
  mode: STREAM/SAMPLE
  encoding: JSON
  sampleInterval: 60s