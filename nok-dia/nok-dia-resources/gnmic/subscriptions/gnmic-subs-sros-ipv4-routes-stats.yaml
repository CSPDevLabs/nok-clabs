apiVersion: operator.gnmic.dev/v1alpha1
kind: Subscription
metadata:
  namespace: nok-dia
  name: sros-ipv4-routes-stats
  labels:
    type: rt-stats
spec:
  paths:
    - /state/router[router-name=*]/route-table/unicast/ipv4/statistics/bgp/active-routes
    - /state/router[router-name=*]/route-table/unicast/ipv4/statistics/bgp/available-routes
    - /state/router[router-name=*]/route-table/unicast/ipv4/statistics/isis/active-routes
    - /state/router[router-name=*]/route-table/unicast/ipv4/statistics/isis/available-routes
    - /state/router[router-name=*]/route-table/unicast/ipv4/statistics/ospf/active-routes
    - /state/router[router-name=*]/route-table/unicast/ipv4/statistics/ospf/available-routes    
    - /state/router[router-name=*]/route-table/unicast/ipv4/statistics/ospfv3/active-routes
    - /state/router[router-name=*]/route-table/unicast/ipv4/statistics/ospfv3/available-routes
    - /state/router[router-name=*]/route-table/unicast/ipv4/statistics/static/active-routes
    - /state/router[router-name=*]/route-table/unicast/ipv4/statistics/static/available-routes                  
  mode: STREAM/SAMPLE
  encoding: JSON
  sampleInterval: 60s