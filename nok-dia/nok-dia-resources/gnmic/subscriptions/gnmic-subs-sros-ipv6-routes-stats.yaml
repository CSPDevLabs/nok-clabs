apiVersion: operator.gnmic.dev/v1alpha1
kind: Subscription
metadata:
  namespace: nok-dia
  name: sros-ipv6-routes-stats
  labels:
    type: rt-stats
spec:
  paths:
    - /state/router[router-name=*]/route-table/unicast/ipv6/statistics/bgp/active-routes
    - /state/router[router-name=*]/route-table/unicast/ipv6/statistics/bgp/available-routes
    - /state/router[router-name=*]/route-table/unicast/ipv6/statistics/isis/active-routes
    - /state/router[router-name=*]/route-table/unicast/ipv6/statistics/isis/available-routes
    - /state/router[router-name=*]/route-table/unicast/ipv6/statistics/ospfv3/active-routes
    - /state/router[router-name=*]/route-table/unicast/ipv6/statistics/ospfv3/available-routes
    - /state/router[router-name=*]/route-table/unicast/ipv6/statistics/static/active-routes
    - /state/router[router-name=*]/route-table/unicast/ipv6/statistics/static/available-routes       
    - /state/router[router-name=*]/route-table/unicast/ipv6/statistics/dhcpv6-na/active-routes
    - /state/router[router-name=*]/route-table/unicast/ipv6/statistics/dhcpv6-na/available-routes
    - /state/router[router-name=*]/route-table/unicast/ipv6/statistics/dhcpv6-pd/active-routes
    - /state/router[router-name=*]/route-table/unicast/ipv6/statistics/dhcpv6-pd/available-routes
    - /state/router[router-name=*]/route-table/unicast/ipv6/statistics/srv6/active-routes
    - /state/router[router-name=*]/route-table/unicast/ipv6/statistics/srv6/available-routes            
  mode: STREAM/SAMPLE
  encoding: JSON
  sampleInterval: 60s