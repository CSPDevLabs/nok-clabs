apiVersion: operator.gnmic.dev/v1alpha1
kind: Subscription
metadata:
  namespace: nok-dia
  name: sros-system-details
  labels:
    type: systemDetails
spec:
  paths:
    - /state/system/oper-name
    - /state/system/version/version-string
  mode: STREAM/SAMPLE
  encoding: JSON
  sampleInterval: 60s