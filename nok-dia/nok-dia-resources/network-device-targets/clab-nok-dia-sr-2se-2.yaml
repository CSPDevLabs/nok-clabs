apiVersion: nok.dev/v1alpha1
kind: NetworkDeviceTarget
metadata:
  name: clab-nok-dia-sr-2se-2
  namespace: nok-dia
spec:
  address: 172.23.20.102
  hostname: clab-nok-dia-sr-2se-2
  commonLabels:
    vendor: Nokia
    environment: production
    type: core    
  sdcio:
    enabled: true
    credentialsSecretRef: device-credentials
    connectionProfileRef: gnmi-skipverify
    syncProfileRef: gnmi-get
    schema:
      provider: sros.nokia.sdcio.dev
      version: B-25.10.R1
    labels:
      sdcio.dev/region: us-central
      sdcio.dev/role: dia
  gnmic:
    enabled: true
    credentialsSecretRef: device-credentials
    targetProfileRef: default-profile
    port: "57400"
    labels:
      role: dia