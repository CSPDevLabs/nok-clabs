apiVersion: operator.gnmic.dev/v1alpha1
kind: Pipeline
metadata:
  namespace: nok-dia
  name: core-metrics
spec:
  clusterRef: dia-core-metrics
  enabled: true
  targetSelectors:
    - matchLabels:
        type: core
  subscriptionSelectors:
    - matchLabels:
        type: core
  outputs:
    outputSelectors:
      - matchLabels:
          type: dia-ext-output  
    processorRefs:
      - oper-state-to-int              
