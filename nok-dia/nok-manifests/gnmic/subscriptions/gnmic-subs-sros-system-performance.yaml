apiVersion: operator.gnmic.dev/v1alpha1
kind: Subscription
metadata:
  namespace: nok-dia
  name: sros-system-performance
  labels:
    type: dia
spec:
  paths:
    - /state/system/cpu[sample-period=60]/summary/usage
    - /state/system/memory-pools/summary/available-memory
    - /state/system/memory-pools/summary/current-total-size
    - /state/system/memory-pools/summary/total-in-use
    - /state/system/up-time
    - /state/cpm[cpm-slot=*]/hardware-data/temperature
    - /state/cpm[cpm-slot=*]/hardware-data/temperature-threshold
    - /state/card[slot-number=*]/hardware-data/temperature
    - /state/card[slot-number=*]/hardware-data/temperature-threshold
    - /state/card[slot-number=*]/mda[mda-slot=*]/hardware-data/temperature
    - /state/card[slot-number=*]/mda[mda-slot=*]/hardware-data/temperature-threshold
    - /state/chassis[chassis-class=*][chassis-number=*]/hardware-data/temperature
    - /state/chassis[chassis-class=*][chassis-number=*]/hardware-data/temperature-threshold
    - /state/cpm[cpm-slot=*]/flash[flash-id=3]/percent-used
  mode: STREAM/SAMPLE
  encoding: JSON
  sampleInterval: 60s