apiVersion: operator.gnmic.dev/v1alpha1
kind: Pipeline
metadata:
  namespace: nok-cgnat
  name: cgnat-tel
spec:
  clusterRef: cgnat-metrics
  enabled: true
  targetSelectors:
    - matchLabels:
        vendor: Nokia
        role: cgnat
  # SR-SIM sr-1s wedges gRPC with 4+ SAMPLE subs; Grafana A1 only needs oper-state.
  subscriptionRefs:
    - sros-nat-availability-refresh
  outputs:
    outputSelectors:
      - matchLabels:
          type: cgnat-ext-output
    processorRefs:
      - oper-state-to-int
