apiVersion: operator.gnmic.dev/v1alpha1
kind: Pipeline
metadata:
  namespace: nok-cgnat
  name: cgnat-core-tel
spec:
  clusterRef: cgnat-metrics
  enabled: true
  targetSelectors:
    - matchLabels:
        vendor: Nokia
        role: cgnat-core
  subscriptionRefs:
    - sros-system-performance
  outputs:
    outputSelectors:
      - matchLabels:
          type: cgnat-ext-output
    processorRefs:
      - oper-state-to-int
