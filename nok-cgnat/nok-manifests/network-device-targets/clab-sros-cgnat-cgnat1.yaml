apiVersion: nok.dev/v1alpha1
kind: NetworkDeviceTarget
metadata:
  name: clab-sros-cgnat-cgnat1
  namespace: nok-cgnat
spec:
  address: 172.21.30.11
  hostname: clab-sros-cgnat-cgnat1
  commonLabels:
    vendor: Nokia
    environment: lab
  sdcio:
    # Lab: config-server datastore not ready; SDCIO gNMI reconnects wedge SR-SIM gRPC.
    enabled: false
    credentialsSecretRef: device-credentials
    connectionProfileRef: gnmi-skipverify
    syncProfileRef: gnmi-get
    schema:
      provider: sros.nokia.sdcio.dev
      version: B-26.7.R1
    labels:
      sdcio.dev/region: lab
      sdcio.dev/role: cgnat
  gnmic:
    enabled: true
    credentialsSecretRef: device-credentials
    targetProfileRef: default-profile
    port: "57400"
    labels:
      role: cgnat
