name: CG-NAT recipe tests

on:
  push:
    paths:
      - "nok-cgnat/**"
      - ".github/workflows/cgnat-recipe-tests.yml"
  pull_request:
    paths:
      - "nok-cgnat/**"
      - ".github/workflows/cgnat-recipe-tests.yml"

jobs:
  recipe-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Validate recipe artifacts
        run: python -m unittest discover -s nok-cgnat/tests -v
      - name: Check host scripts
        run: sh -n nok-cgnat/configs/hosts/lan.sh nok-cgnat/configs/hosts/inet.sh nok-cgnat/configs/hosts/nat44-cpe.sh
